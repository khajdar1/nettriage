version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet, so `pnpm lint` fails on it (ruling R15).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/modules/app", "/infra/modules/edge", "/infra/envs/dev"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
