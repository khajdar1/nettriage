name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Atomic conditional writes for the rate limiter's concurrency test (spec §11.4); moto's
      # in-process DynamoDB, which the other tests use, isn't atomic.
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      NETTRIAGE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NETTRIAGE_TEST_DYNAMODB_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lint, type-check and test
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pytest --cov=nettriage.domain --cov=nettriage.application --cov-report=term-missing --cov-fail-under=85

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Test the tools
        run: uv run --locked --project backend python -m pytest tools/tests
      - name: Measure detection quality
        run: |
          status=0
          uv run --locked --project backend python -m tools.scenarios report --out dist/detection-report.md || status=$?
          cat dist/detection-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: detection-report
          path: dist/detection-report.md
          retention-days: 7
      - name: Check that every action is pinned to a commit SHA
        run: uv run --locked --project backend python tools/check_pinned_actions.py .github/workflows
      - name: Check that CI holds no cloud access
        run: uv run --locked --project backend python tools/check_no_cloud_access.py .
      - name: Build the Lambda package
        run: uv run --locked --project backend python tools/build_lambda.py --out dist/backend.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-zip
          path: dist/backend.zip
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Check that the typed client matches the API's OpenAPI document
        run: pnpm check:api
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
      - run: pnpm check:csp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test infra/modules/edge/functions/*.test.mjs

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "<2.0.0"
      - name: Format, validate and test
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/modules/app infra/modules/data infra/modules/edge infra/modules/identity infra/modules/pipeline; do
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate && terraform test)
          done
          (cd infra/envs/dev && terraform init -backend=false -input=false && terraform validate)
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: tflint
        run: tflint --init && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml
          quiet: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
