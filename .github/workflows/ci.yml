name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Lint, type-check and test
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
          uv run --locked pytest --cov=nettriage.domain --cov-report=term-missing --cov-fail-under=85

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Test the tools
        run: uv run --locked --project backend python -m pytest tools/tests
      - name: Measure detection quality
        run: |
          status=0
          uv run --locked --project backend python -m tools.scenarios report --out dist/detection-report.md || status=$?
          cat dist/detection-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: detection-report
          path: dist/detection-report.md
          retention-days: 7
      - name: Check that every action is pinned to a commit SHA
        run: uv run --locked --project backend python tools/check_pinned_actions.py .github/workflows
      - name: Check that CI holds no cloud access
        run: uv run --locked --project backend python tools/check_no_cloud_access.py .
      - name: Build the Lambda package
        run: uv run --locked --project backend python tools/build_lambda.py --out dist/backend.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-zip
          path: dist/backend.zip
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
      - run: pnpm check:csp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node --test infra/modules/edge/functions/*.test.mjs

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "<2.0.0"
      - name: Format, validate and test
        run: |
          terraform fmt -check -recursive infra
          for dir in infra/bootstrap infra/modules/app infra/modules/edge; do
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate && terraform test)
          done
          (cd infra/envs/dev && terraform init -backend=false -input=false && terraform validate)
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - name: tflint
        run: tflint --init && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml
          quiet: true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
